name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check src tests
      # No price data is committed, so the tests that need the real panel
      # skip here. The synthetic-panel suite is the leakage contract.
      - run: python -m pytest tests/ -q -rs
