model:
  family: lstm
  lookback: 30
  hidden_size: 48
  num_layers: 1
  dropout: 0.3
  asset_embedding_dim: 4    # single multi-asset model with an asset embedding
  batch_size: 128
  max_epochs: 100
  lr: 0.001
  weight_decay: 0.0001
  grad_clip: 1.0
  patience: 12
  loss: auto                # bce for direction, huber for return, mse for vol
