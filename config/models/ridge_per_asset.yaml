# The ridge family fitted once per asset instead of once across the panel.
# Everything except the scope is inherited from ridge.yaml, so a gap between the
# two arms is a difference in scope and not in a hyper-parameter.
model:
  extends: ridge.yaml
  fit_scope: per_asset
  # An asset with fewer training rows than this in a fold is skipped for that
  # fold rather than fitted on scraps. Same floor as splits.min_train_rows.
  min_train_rows: 500
